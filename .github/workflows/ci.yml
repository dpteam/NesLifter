name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build + test (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NesLifter.slnx

      - name: Build
        run: dotnet build NesLifter.slnx -c ${{ matrix.configuration }} --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test tests/NesLifter.Tests/NesLifter.Tests.csproj -c ${{ matrix.configuration }} --no-build

      - name: Self-test (lift, compile, execute every mapper)
        run: dotnet run --project NesLifter.csproj -c ${{ matrix.configuration }} --no-build -- --selftest --frames 60 --keep

      - name: Upload self-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.configuration }}
          path: nes_lifted_output/_selftest
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: publish
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish lifter
        run: >
          dotnet publish NesLifter.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist

      - name: Verify published layout
        shell: pwsh
        run: |
          # The single-file bundle carries the managed assemblies, but the GUI's
          # web/ folder and the WebView2 native loader must sit next to the exe
          # or the interface cannot start. Fail loudly rather than shipping a
          # broken zip.
          $missing = @()
          if (-not (Test-Path 'dist/NesLifter.exe')) { $missing += 'NesLifter.exe' }
          if (-not (Test-Path 'dist/web/index.html')) { $missing += 'web/index.html' }
          if (-not (Test-Path 'dist/web/vendor/nes.css/nes.min.css')) { $missing += 'web/vendor/nes.css' }
          if (-not (Test-Path 'dist/assets/icon.ico')) { $missing += 'assets/icon.ico' }

          # The loader lives under runtimes/<rid>/native in a framework-dependent
          # publish; a self-contained one may flatten it next to the exe.
          $loader = @(
            'dist/WebView2Loader.dll',
            'dist/runtimes/win-x64/native/WebView2Loader.dll'
          ) | Where-Object { Test-Path $_ }

          if ($loader.Count -eq 0) { $missing += 'WebView2Loader.dll' }

          if ($missing.Count -gt 0) {
            Write-Error "Published output is missing: $($missing -join ', ')"
            exit 1
          }

          Write-Host 'Published layout looks complete.'

      - name: Upload lifter
        uses: actions/upload-artifact@v4
        with:
          name: NesLifter-win-x64
          path: dist
          retention-days: 30

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build + test (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NesLifter.slnx

      - name: Build
        run: dotnet build NesLifter.slnx -c ${{ matrix.configuration }} --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test tests/NesLifter.Tests/NesLifter.Tests.csproj -c ${{ matrix.configuration }} --no-build

      - name: Self-test (lift, compile, execute every mapper)
        run: dotnet run --project NesLifter.csproj -c ${{ matrix.configuration }} --no-build -- --selftest --frames 60 --keep

      - name: Upload self-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.configuration }}
          path: nes_lifted_output/_selftest
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: publish
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish lifter
        run: >
          dotnet publish NesLifter.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist

      - name: Verify published layout
        shell: pwsh
        run: |
          # The single-file bundle carries the managed assemblies, but the GUI's
          # web/ folder must sit next to the exe or the interface cannot start.
          # assets/icon.ico is excluded from the bundle on purpose: GamePackager
          # uses it as the fallback icon for generated games, so it has to exist
          # as a real file.
          $missing = @()
          if (-not (Test-Path 'dist/NesLifter.exe')) { $missing += 'NesLifter.exe' }
          if (-not (Test-Path 'dist/web/index.html')) { $missing += 'web/index.html' }
          if (-not (Test-Path 'dist/web/vendor/nes.css/nes.min.css')) { $missing += 'web/vendor/nes.css' }
          if (-not (Test-Path 'dist/assets/icon.ico')) { $missing += 'assets/icon.ico' }

          if ($missing.Count -gt 0) {
            Write-Error "Published output is missing: $($missing -join ', ')"
            exit 1
          }

          Write-Host 'Published layout looks complete.'

      # WebView2Loader.dll is a native dependency that PublishSingleFile with
      # IncludeNativeLibrariesForSelfExtract packs *into* the exe and unpacks to a
      # temp folder on first run. Asserting it exists next to the exe fails on a
      # correct build, so instead run the published binary: if the bundle were
      # broken, the process would fail to start at all.
      - name: Smoke-test published binary
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke-out'

          & dist/NesLifter.exe --selftest --frames 30 --output $out --no-tui 2>&1 |
            Tee-Object -Variable log

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Published binary exited with $LASTEXITCODE"
            exit 1
          }

          if (($log -join "`n") -notmatch 'Summary: ok=') {
            Write-Error 'Published binary did not run the self-test.'
            exit 1
          }

          Write-Host 'Published binary runs.'

      - name: Verify the GUI resources resolve
        shell: pwsh
        run: |
          # The GUI loads web/index.html through a virtual host rooted at
          # AppContext.BaseDirectory. If the web folder did not ship, the window
          # opens blank and nothing in the build fails, so check the files the
          # page actually references are present and non-empty.
          $required = @(
            'dist/web/index.html',
            'dist/web/app.js',
            'dist/web/theme.css',
            'dist/web/sfx.js',
            'dist/web/vendor/nes.css/nes.min.css',
            'dist/web/vendor/fontawesome/css/all.min.css',
            'dist/web/vendor/fontawesome/webfonts/fa-solid-900.woff2'
          )

          $bad = @()

          foreach ($file in $required) {
            if (-not (Test-Path $file)) { $bad += "$file (missing)"; continue }
            if ((Get-Item $file).Length -eq 0) { $bad += "$file (empty)" }
          }

          if ($bad.Count -gt 0) {
            Write-Error "GUI resources broken: $($bad -join ', ')"
            exit 1
          }

          Write-Host 'GUI resources present.'

      - name: Upload lifter
        uses: actions/upload-artifact@v4
        with:
          name: NesLifter-win-x64
          path: dist
          retention-days: 30
